# True color
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-overrides ",xterm-kitty:Tc"
set -g allow-passthrough on
set -ga terminal-features ",xterm-kitty:sixel"
set -g mouse on

set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0

# set prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Alt vim key to switch Windows
bind -n M-h previous-window
bind -n M-l next-window

# Alt vim key to switch Sessions
bind -n M-k switch-client -p
bind -n M-j switch-client -n

# Session picker: show all sessions expanded with their windows
bind s choose-tree -ZwG

#options
set -g mode-keys vi
set-option -g set-clipboard on

set -g @plugin 'tmux-plugins/tpm'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'omerxx/tmux-sessionx'

# sessionx config
set -g @sessionx-bind 'o'                 # prefix + o opens the picker
set -g @sessionx-window-mode 'on'         # show windows under sessions
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '60%'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '85%'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W - #T"
set -g @catppuccin_window_current_text " #W - #T"

# binding for yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#Vim Tmux Navigatoset -g @continuum-restore 'on'
set -g @continuum-save-interval '15'  # saves every 15 minutesr

#open pane in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# btop display popup
bind-key B display-popup -E -h 50 "btop"

# Agent team layout (for Claude Code multi-agent sessions)
# prefix+t: rearrange into 3-column layout (lead center, agents left/right)
# prefix+y: kill agent panes and restore standard layout
# prefix+3: create fresh triple layout from a single pane
set -g @center_width 100
bind-key t run-shell "~/.tmux/layout.sh team"
bind-key y run-shell "~/.tmux/layout.sh team-restore"
bind-key 3 run-shell "~/.tmux/layout.sh triple"


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'run-shell "~/.tmux/select_pane.sh -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'run-shell "~/.tmux/select_pane.sh -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'run-shell "~/.tmux/select_pane.sh -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'run-shell "~/.tmux/select_pane.sh -R"'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

set -g focus-events on

# Toggle auto-scaling on focus (prefix + Z)
bind-key Z run-shell "
  if tmux show-option -gqv @autoscale | grep -q on; then
    tmux set -g @autoscale off
    tmux set-hook -g pane-focus-in 'select-pane -P \"bg=default,fg=default\"'
    tmux display-message 'Auto-scale OFF'
  else
    tmux set -g @autoscale on
    tmux set-hook -g pane-focus-in 'select-pane -P \"bg=default,fg=default\" ; resize-pane -x 60% -y 60%'
    tmux display-message 'Auto-scale ON'
  fi
"

# Load catppuccin, set status, then load battery via TPM
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}#{E:@catppuccin_status_gitmux}"
set -gF status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
